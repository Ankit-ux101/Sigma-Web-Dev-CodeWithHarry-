<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px hsl(143, 85%, 81%);
        }

        .text-element {
            text-shadow: 2px 2px 4px #ed1717;
            outline: 2px solid black;
            /* outline is not part of the CSS box model and hence not similar to border*/
            border: 2px solid green;
            border-radius: 16px;
            outline-offset: 47px;
        }
    </style>
</head>

<body>
    <div class="box">I am a box</div>

    <p class="text-element">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Iure dolorum odio illo sint
        nostrum
        accusantium error cumque quisquam? Laboriosam nihil, porro, sapiente distinctio ex recusandae eos illo fuga
        sequi amet officia. Non, illo autem.</p>
</body>

</html>
