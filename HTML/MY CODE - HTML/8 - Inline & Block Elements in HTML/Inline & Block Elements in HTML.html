<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            background-color: aqua;
            margin: 10px 0;
            padding: 10px 0;
            font-size: large;
            
        }

        span {
            background-color: blue;
            font-size: large;
        }

        section {
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <div> Hello World</div>
    <span> Doom World</span>

    <!-- quick quiz :
    Without using br tag, write a vertically aligned form asking for name, city and pincode of a user. -->

    <form action="post">
        <section>
            <label for="username">Name</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
        </section>
        <section>
            <label for="username">City</label>
            <input type="text" id="city" name="city" placeholder="Enter your city">
        </section>
        <section>
            <label for="username">Pincode</label>
            <input type="text" id="pincode" name="pincode" placeholder="Enter your pincode">
        </section>
    </form>
</body>

</html>
