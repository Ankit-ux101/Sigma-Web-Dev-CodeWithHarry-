<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video, Audio & Media in HTML</title>
</head>

<body>
    <video src="video.mp4" height="355" width="255" controls autoplay loop muted poster="download.jpg"></video>

    <audio src="sachin.mp3" controls autoplay loop muted preload="none"></audio>

    <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
        <circle cx="100" cy="100" r="80" fill="blue" />
    </svg>

    <img src="img.svg" alt="My svg">

    <iframe src="https://hianime.to/watch/naruto-shippuden-355?ep=8270" width="322" height="444"></iframe>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/XZwBNDGuWGU?si=6vGxnvJvEEyzK-zM"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <!-- Quick Quiz -->
         Create a website which shows video of different of category and audio of different categories.
         You can use Youtube vidoes in iframe using Youtube's embedding feature
</body>

</html>
