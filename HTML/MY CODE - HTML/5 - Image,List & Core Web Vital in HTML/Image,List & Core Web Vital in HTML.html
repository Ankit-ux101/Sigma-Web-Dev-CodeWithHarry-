<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
    <style>
        td {
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <img src="VS CODE GLASS MORPHISIM THUMBNAIL.png" alt="THUMBNAIL" width="720">
    <br>


    <table>
        <caption> Student Details </caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll No.</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="2">Ankit</td>
                <td rowspan="2">07</td>
            </tr>
            <tr>
                <td colspan="2">Ankit</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2">Harry</td>
                <td>01</td>
            <tr>
                <td colspan="3">This is a footer</td>
            </tr>
            </tr>
        </tfoot>
    </table>



    <ul type="square">
        <li>Rohan</li>
        <li>Subham</li>
        <li>Hello World</li>
    </ul>
    <ol type="A"> // type can also be i, I, a, 1
        <li>Rohan</li>
        <li>Subham</li>
        <li>Hello World</li>
    </ol>
    <dl>
        <dt>Hello World</dt>
        <dd>I don't know what to write here</dd>
    </dl>
</body>

</html>
