<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .navbar {
            display: flex;
            list-style-type: none;
            gap: 10px;
        }
    </style>
</head>

<body>
    <!-- Semantic Tags -> are use for SEO purposes, so that search engine could be read the website efficiently. -->

    <header>
        <nav>
            <ul class="navbar">
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>What are Semantic Tags</h1>
            <article>
                Hello this is a random test Text.
            </article>

            <figure> <!-- Use to specify to the browser directly that there is some image, graph, svg present here -->
                <img src="image.jpg" alt="Description">
                <figcaption>Caption describing the figure</figcaption>
            </figure>
        </section> <!-- section should be inside main tag not the opposite -->
    </main>

    <footer>
        Copyright CWH | All rights reserved
    </footer>
</body>

</html>
